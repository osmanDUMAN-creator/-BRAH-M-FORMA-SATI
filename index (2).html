<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />

    <style>
        /* --- CSS BAŞLANGIÇ --- */
        :root {
            --primary: #fbbf24;       /* Altın Sarısı */
            --bg-overlay: rgba(10, 10, 20, 0.85); /* Arka plan karartma */
            --card-bg: rgba(30, 41, 59, 0.95);    /* Kart Rengi */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255,255,255,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            /* STADYUM ARKA PLANI */
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('https://wallpaperaccess.com/full/1149755.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--primary);
            padding: 1.2rem 2rem;
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 5px 30px rgba(0,0,0,0.8);
        }

        .logo {
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
        }
        .logo span { color: var(--primary); }

        .cart-btn {
            background: var(--primary);
            color: #0f172a;
            padding: 10px 25px;
            border-radius: 4px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            transition: transform 0.2s;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            font-family: 'Teko', sans-serif;
            font-size: 1.2rem;
        }
        .cart-btn:hover { transform: scale(1.05); background: #fff; }
        .badge { background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.9rem; font-family: sans-serif;}

        /* CONTAINER */
        .container {
            max-width: 1400px; margin: 2rem auto; padding: 0 20px;
            display: flex; gap: 30px;
        }

        /* SIDEBAR */
        aside {
            flex: 0 0 280px;
            background: rgba(20, 20, 25, 0.9);
            padding: 25px; border-radius: 12px;
            height: fit-content; border: 1px solid var(--border);
            position: sticky; top: 110px; backdrop-filter: blur(10px);
        }
        aside h3 { color: var(--primary); margin-bottom: 20px; font-family: 'Teko', sans-serif; font-size: 1.8rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .filter-group { margin-bottom: 20px; }
        .filter-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
        select, input {
            width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.5); border: 1px solid #444;
            color: white; border-radius: 6px; outline: none; font-family: 'Poppins', sans-serif;
        }
        select:focus, input:focus { border-color: var(--primary); }
        .btn-reset {
            width: 100%; padding: 12px; background: #dc2626; color: white; border: none;
            border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 10px; font-family: 'Teko', sans-serif; font-size: 1.2rem;
        }

        /* GRID */
        main { flex: 1; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }

        /* KART TASARIMI */
        .card {
            background: var(--card-bg); border-radius: 12px; overflow: hidden;
            border: 1px solid var(--border); display: flex; flex-direction: column;
            transition: all 0.3s ease; position: relative;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 15px 40px rgba(0,0,0,0.7); }

        /* Resim Alanı */
        .img-wrap {
            height: 280px; background: #1a1a1a; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; border-bottom: 1px solid #333;
        }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .card:hover .card-img { transform: scale(1.1); }
        
        .season-badge {
            position: absolute; top: 10px; right: 10px; background: var(--primary); color: black;
            font-weight: 800; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; z-index: 2;
        }

        .card-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .team-tag { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 5px; }
        .card-title { font-size: 1.15rem; font-weight: 600; margin: 0 0 10px 0; line-height: 1.3; color: white; }
        .size-list { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .size-badge { font-size: 0.75rem; border: 1px solid #555; padding: 3px 8px; border-radius: 4px; color: #ccc; }
        .card-price { font-size: 1.4rem; font-weight: 700; color: var(--primary); margin-top: auto; font-family: 'Teko', sans-serif; }

        .btn-add {
            width: 100%; margin-top: 15px; padding: 12px; background: white; color: black;
            border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s;
            font-family: 'Teko', sans-serif; font-size: 1.2rem; letter-spacing: 1px;
        }
        .btn-add:hover { background: var(--primary); }

        /* MODAL */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none;
            justify-content: center; align-items: center; z-index: 200;
        }
        .modal {
            background: #1e293b; width: 95%; max-width: 600px; padding: 30px;
            border-radius: 12px; border: 1px solid var(--primary); max-height: 80vh; overflow-y: auto;
        }
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #0f172a; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #334155;
        }
        .btn-link { text-decoration: none; background: #22c55e; color: white; padding: 8px 15px; border-radius: 4px; font-size: 0.9rem; margin-right: 10px; font-weight: bold; }
        .btn-del { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        @media (max-width: 900px) { .container { flex-direction: column; } aside { width: 100%; position: relative; top: 0; } }
    </style>
</head>

            const matchesTeam = team === "" || p.team === team;
            const matchesSeason = season === "" || p.season == season;
            const matchesSize = size === "" || p.sizes.includes(size);

            return matchesSearch && matchesTeam && matchesSeason && matchesSize;
        });

        countDisplay.innerText = filtered.length;
        grid.innerHTML = "";

        if(filtered.length === 0) {
            grid.innerHTML = "<h3 style='grid-column: span 3; text-align:center; color:#94a3b8;'>Aradığınız kriterde forma bulunamadı.</h3>";
            return;
        }

        filtered.forEach(p => {
            const sizesHtml = p.sizes.map(s => `<span class="size-badge">${s}</span>`).join("");
            
            const div = document.createElement("div");
            div.className = "card";
            div.innerHTML = `
                <div class="season-badge">${p.season}</div>
                <div class="img-wrap">
                    <img src="${p.img}" class="card-img" alt="${p.title}">
                </div>
                <div class="card-body">
                    <div class="team-tag">${p.team}</div>
                    <div class="card-title">${p.title}</div>
                    <div class="size-list">${sizesHtml}</div>
                    <div class="card-price">${p.price.toLocaleString('tr-TR')} TL</div>
                    <button class="btn-add" onclick="addToCart(${p.id})">SEPETE EKLE</button>
                </div>
            `;
            grid.appendChild(div);
        });
    }

    function resetFilters() {
        document.getElementById("searchInput").value = "";
        document.getElementById("teamSelect").value = "";
        document.getElementById("seasonSelect").value = "";
        document.getElementById("sizeSelect").value = "";
        renderProducts();
    }

    function addToCart(id) {
        const item = products.find(p => p.id === id);
        cart.push(item);
        document.getElementById("cartBadge").innerText = cart.length;
        alert("✅ " + item.title + " sepete eklendi!");
    }

    function toggleCart() {
        const modal = document.getElementById("cartModal");
        const listDiv = document.getElementById("cartList");
        
        if (modal.style.display === "flex") {
            modal.style.display = "none";
        } else {
            listDiv.innerHTML = "";
            if(cart.length === 0) {
                listDiv.innerHTML = "<p style='color:#94a3b8; text-align:center; font-size:1.2rem;'>Sepetiniz şu an boş.</p>";
            } else {
                cart.forEach((item, index) => {
                    const row = document.createElement("div");
                    row.className = "cart-item";
                    row.innerHTML = `
                        <div>
                            <div style="color:white; font-weight:bold; font-size:1.1rem;">${item.title}</div>
                            <div style="color:#94a3b8; font-size:0.9rem;">${item.price} TL</div>
                        </div>
                        <div>
                            <a href="${item.link}" target="_blank" class="btn-link">SATIN AL ➚</a>
                            <button class="btn-del" onclick="removeFromCart(${index})">SİL</button>
                        </div>
                    `;
                    listDiv.appendChild(row);
                });
            }
            modal.style.display = "flex";
        }
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        document.getElementById("cartBadge").innerText = cart.length;
        toggleCart();
    }

    // Başlangıçta çalıştır
    renderProducts();

</script>
</body>
</html>
